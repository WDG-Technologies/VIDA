name: vida_app
description: VIDA — App espiritual cristiana con versículos, racha, estudio bíblico y más.
publish_to: 'none'
version: 0.9.22+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shared_preferences: ^2.5.5
  home_widget: ^0.7.0
  webview_flutter: ^4.10.0
  connectivity_plus: ^6.0.3
  share_plus: ^10.0.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  flutter_local_notifications: ^21.0.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_auth: ^5.5.6
  geolocator: ^13.0.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  liquid_glass_renderer: ^0.2.0-dev.4
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  app_links: ^7.0.0
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600

  assets:
    - contra_img/
    - gallery/
    - widget-fav.png
    - games/quiz/index.html
    - games/quiz/sw.js
    - games/riega/index.html
    - assets/bible/rvr1909.json
    - assets/data/daily_verses.json
    - assets/data/iglesias_mexico.json